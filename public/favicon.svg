<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ff-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ff-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="32" height="32" rx="8" fill="url(#ff-grad)" />

  <!-- Inner Subtle Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" />

  <!-- FileFlow Layered Brand Emblem (FiLayers) -->
  <g transform="translate(4, 4)">
    <!-- Top Floating Sheet -->
    <polygon points="12 4.2 3.2 8.7 12 13.2 20.8 8.7" fill="url(#ff-top)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Middle Pipeline Sheet -->
    <polyline points="3.2 12.8 12 17.3 20.8 12.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    
    <!-- Bottom Destination Sheet -->
    <polyline points="3.2 16.9 12 21.4 20.8 16.9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  </g>
</svg>